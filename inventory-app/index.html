<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern React Inventory Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .App {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #667eea;
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        .stat-card p {
            color: #7f8c8d;
            font-weight: 500;
        }

        .main-content {
            padding: 30px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .search-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .inventory-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .inventory-card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .card-category {
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .card-details {
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #6c757d;
        }

        .detail-row strong {
            color: #495057;
        }

        .stock-status {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
        }

        .stock-high {
            background: #d4edda;
            color: #155724;
        }

        .stock-medium {
            background: #fff3cd;
            color: #856404;
        }

        .stock-low {
            background: #f8d7da;
            color: #721c24;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9rem;
            border-radius: 20px;
        }

        .btn-edit {
            background: #17a2b8;
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .modal {
            display: flex;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-weight: 300;
        }

        .close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .close:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .modal-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #dee2e6;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #495057;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: auto;
            }

            .inventory-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const categories = [
            'Electronics',
            'Clothing',
            'Food',
            'Books',
            'Furniture',
            'Tools',
            'Other'
        ];

        const App = () => {
            const [inventory, setInventory] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [formData, setFormData] = useState({
                name: '',
                category: '',
                quantity: '',
                price: '',
                description: ''
            });

            useEffect(() => {
                const savedInventory = localStorage.getItem('inventory');
                if (savedInventory) {
                    setInventory(JSON.parse(savedInventory));
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('inventory', JSON.stringify(inventory));
            }, [inventory]);

            const filteredInventory = inventory.filter(item =>
                item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                item.category.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (item.description && item.description.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const getStockStatus = (quantity) => {
                if (quantity > 20) return { class: 'stock-high', text: 'In Stock' };
                if (quantity > 5) return { class: 'stock-medium', text: 'Medium Stock' };
                return { class: 'stock-low', text: 'Low Stock' };
            };

            const getStats = () => {
                const totalItems = inventory.length;
                const lowStock = inventory.filter(item => item.quantity <= 5).length;
                const totalValue = inventory.reduce((sum, item) => sum + (item.quantity * item.price), 0);
                const uniqueCategories = new Set(inventory.map(item => item.category)).size;

                return { totalItems, lowStock, totalValue, uniqueCategories };
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (!formData.name || !formData.category || !formData.quantity || !formData.price) {
                    alert('Please fill in all required fields');
                    return;
                }

                const item = {
                    id: editingItem?.id || Date.now().toString(),
                    name: formData.name,
                    category: formData.category,
                    quantity: parseInt(formData.quantity),
                    price: parseFloat(formData.price),
                    description: formData.description
                };

                if (editingItem) {
                    setInventory(prev => prev.map(i => i.id === editingItem.id ? item : i));
                } else {
                    setInventory(prev => [...prev, item]);
                }

                resetForm();
            };

            const handleEdit = (item) => {
                setEditingItem(item);
                setFormData({
                    name: item.name,
                    category: item.category,
                    quantity: item.quantity.toString(),
                    price: item.price.toString(),
                    description: item.description || ''
                });
                setIsModalOpen(true);
            };

            const handleDelete = (id) => {
                if (confirm('Are you sure you want to delete this item?')) {
                    setInventory(prev => prev.filter(item => item.id !== id));
                }
            };

            const resetForm = () => {
                setFormData({
                    name: '',
                    category: '',
                    quantity: '',
                    price: '',
                    description: ''
                });
                setEditingItem(null);
                setIsModalOpen(false);
            };

            const stats = getStats();

            return (
                <div className="App">
                    <div className="container">
                        <header className="header">
                            <h1><i className="fas fa-boxes"></i> Inventory Manager</h1>
                            <p>Manage your inventory with style and efficiency</p>
                        </header>

                        <div className="stats">
                            <div className="stat-card">
                                <i className="fas fa-box"></i>
                                <h3>{stats.totalItems}</h3>
                                <p>Total Items</p>
                            </div>
                            <div className="stat-card">
                                <i className="fas fa-exclamation-triangle"></i>
                                <h3>{stats.lowStock}</h3>
                                <p>Low Stock</p>
                            </div>
                            <div className="stat-card">
                                <i className="fas fa-dollar-sign"></i>
                                <h3>${stats.totalValue.toFixed(2)}</h3>
                                <p>Total Value</p>
                            </div>
                            <div className="stat-card">
                                <i className="fas fa-tags"></i>
                                <h3>{stats.uniqueCategories}</h3>
                                <p>Categories</p>
                            </div>
                        </div>

                        <main className="main-content">
                            <div className="controls">
                                <div className="search-box">
                                    <input
                                        type="text"
                                        placeholder="Search inventory..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                    <i className="fas fa-search"></i>
                                </div>
                                <button className="btn btn-primary" onClick={() => setIsModalOpen(true)}>
                                    <i className="fas fa-plus"></i> Add Item
                                </button>
                            </div>

                            <div className="inventory-grid">
                                {filteredInventory.map(item => {
                                    const stockStatus = getStockStatus(item.quantity);
                                    const totalValue = item.quantity * item.price;

                                    return (
                                        <div key={item.id} className="inventory-card">
                                            <div className="card-header">
                                                <div>
                                                    <div className="card-title">{item.name}</div>
                                                    <div className="card-category">{item.category}</div>
                                                </div>
                                            </div>
                                            <div className="card-details">
                                                <div className="detail-row">
                                                    <span><strong>Quantity:</strong></span>
                                                    <span>{item.quantity}</span>
                                                </div>
                                                <div className="detail-row">
                                                    <span><strong>Price:</strong></span>
                                                    <span>${item.price.toFixed(2)}</span>
                                                </div>
                                                <div className="detail-row">
                                                    <span><strong>Total Value:</strong></span>
                                                    <span>${totalValue.toFixed(2)}</span>
                                                </div>
                                                {item.description && (
                                                    <div className="detail-row">
                                                        <span><strong>Description:</strong></span>
                                                        <span>{item.description}</span>
                                                    </div>
                                                )}
                                            </div>
                                            <div className={`stock-status ${stockStatus.class}`}>
                                                {stockStatus.text}
                                            </div>
                                            <div className="card-actions">
                                                <button className="btn btn-small btn-edit" onClick={() => handleEdit(item)}>
                                                    <i className="fas fa-edit"></i> Edit
                                                </button>
                                                <button className="btn btn-small btn-delete" onClick={() => handleDelete(item.id)}>
                                                    <i className="fas fa-trash"></i> Delete
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {filteredInventory.length === 0 && (
                                <div className="empty-state">
                                    <i className="fas fa-box-open"></i>
                                    <h3>No inventory items found</h3>
                                    <p>{searchTerm ? 'Try adjusting your search' : 'Start by adding your first inventory item'}</p>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="modal">
                            <div className="modal-content">
                                <div className="modal-header">
                                    <h2>{editingItem ? 'Edit Item' : 'Add New Item'}</h2>
                                    <button className="close" onClick={resetForm}>&times;</button>
                                </div>
                                <div className="modal-body">
                                    <form onSubmit={handleSubmit}>
                                        <div className="form-group">
                                            <label htmlFor="name">Item Name *</label>
                                            <input
                                                type="text"
                                                id="name"
                                                name="name"
                                                value={formData.name}
                                                onChange={handleInputChange}
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label htmlFor="category">Category *</label>
                                            <select
                                                id="category"
                                                name="category"
                                                value={formData.category}
                                                onChange={handleInputChange}
                                                required
                                            >
                                                <option value="">Select Category</option>
                                                {categories.map(category => (
                                                    <option key={category} value={category}>{category}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label htmlFor="quantity">Quantity *</label>
                                            <input
                                                type="number"
                                                id="quantity"
                                                name="quantity"
                                                value={formData.quantity}
                                                onChange={handleInputChange}
                                                min="0"
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label htmlFor="price"> Price ($) *</label>
                                            <input
                                                type="number"
                                                id="price"
                                                name="price"
                                                value={formData.price}
                                                onChange={handleInputChange}
                                                min="0"
                                                step="0.01"
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label htmlFor="description">Description</label>
                                            <input
                                                type="text"
                                                id="description"
                                                name="description"
                                                value={formData.description}
                                                onChange={handleInputChange}
                                            />
                                        </div>
                                    </form>
                                </div>
                                <div className="modal-footer">
                                    <button type="button" className="btn btn-secondary" onClick={resetForm}>
                                        Cancel
                                    </button>
                                    <button type="submit" className="btn btn-primary" onClick={handleSubmit}>
                                        {editingItem ? 'Update Item' : 'Add Item'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
